{% extends 'store/base.html' %}

{% block content %}
<div class="auth-container">
    <h2>Create Account</h2>

    <div class="form-container">
        <form method="POST">
            {% csrf_token %}

            <div class="form-row">
                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name" value="{{ request.POST.first_name }}">
                </div>
                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" value="{{ request.POST.last_name }}">
                </div>
            </div>

            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" id="username" name="username" value="{{ request.POST.username }}" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" value="{{ request.POST.email }}" required>
            </div>

            <div class="form-group">
                <label for="password1">Password *</label>
                <input type="password" id="password1" name="password1" required>
            </div>

            <div class="form-group">
                <label for="password2">Confirm Password *</label>
                <input type="password" id="password2" name="password2" required>
            </div>

            <button type="submit" class="btn" style="width: 100%;">Create Account</button>
        </form>

        <p class="auth-link">Already have an account? <a href="{% url 'store:login' %}">Sign in</a></p>
    </div>
</div>
{% endblock %}
