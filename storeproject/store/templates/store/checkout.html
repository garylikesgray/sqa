{% extends 'store/base.html' %}

{% block content %}
<h2>Checkout</h2>

<div class="checkout-layout">
    <div class="checkout-form-section">
        <div class="form-container">
            <h3 style="margin-bottom: 24px;">Shipping Details</h3>
            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" value="{{ initial.name }}" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" value="{{ initial.email }}" required>
                </div>

                <div class="form-group">
                    <label for="address">Shipping Address</label>
                    <textarea id="address" name="address" required></textarea>
                </div>

                <button type="submit" class="btn" style="width: 100%;">Place Order</button>
            </form>
        </div>
    </div>

    <div class="checkout-summary">
        <h3 style="margin-bottom: 20px;">Order Summary</h3>
        {% for item in cart_items %}
        <div class="summary-item">
            <span>{{ item.name }} × {{ item.quantity }}</span>
            <span>${{ item.subtotal|floatformat:2 }}</span>
        </div>
        {% endfor %}
        <div class="summary-total">
            <strong>Total</strong>
            <strong>${{ total_price|floatformat:2 }}</strong>
        </div>
    </div>
</div>
{% endblock %}
